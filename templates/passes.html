<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Satellite Passes — GPS Dashboard</title>
  <style>
    :root {
      --bg: #0f172a; --surface: #1e293b; --surface2: #263348;
      --border: #334155; --text: #f1f5f9; --muted: #94a3b8;
      --primary: #3b82f6; --success: #22c55e; --warn: #f59e0b; --radius: 8px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.5; padding: 16px; max-width: 620px; margin: 0 auto; }
    a { color: var(--primary); text-decoration: none; }
    h1 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
    .nav { display: flex; gap: 16px; margin-bottom: 16px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
    .controls { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 14px; }
    .ctl-group { display: flex; flex-direction: column; gap: 5px; }
    .ctl-label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
    .chips { display: flex; gap: 6px; }
    .chip { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 4px 10px; font-size: 12px; cursor: pointer; }
    .chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .summary { font-size: 12px; color: var(--muted); margin-bottom: 14px; line-height: 1.6; }
    .summary b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

    .pass { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; padding: 12px 14px; }
    .pass-head { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
    .sat { display: inline-flex; align-items: center; gap: 7px; font-size: 15px; font-weight: 600; }
    .sw { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
    .sys { color: var(--muted); font-size: 12px; font-weight: 400; }
    .when { margin-left: auto; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .when.up { color: var(--success); }
    .when.soon { color: var(--warn); }

    .legs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
    .leg { background: var(--surface2); border-radius: 6px; padding: 7px 4px; }
    .leg-name { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    .leg-time { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .leg-sub { font-size: 11px; color: var(--muted); }
    .leg.peak .leg-time { color: var(--primary); }
    .pass-foot { display: flex; gap: 14px; margin-top: 9px; font-size: 11px; color: var(--muted); }
    .pass-foot b { color: var(--text); font-weight: 600; }

    .empty { color: var(--muted); text-align: center; padding: 40px 20px; font-size: 14px; }
    .refresh-note { font-size: 12px; color: var(--muted); text-align: center; margin-top: 12px; }
  </style>
</head>
<body>

<div class="nav">
  <a href="/">← Dashboard</a>
  <a href="/skyplot">Skyplot</a>
  <a href="/globe">Globe</a>
  <a href="/gpsd">gpsd</a>
</div>

<h1>Satellite Passes</h1>
<p style="color:var(--muted);font-size:13px;margin-bottom:16px;">Predicted from logged orbits · parked-observer schedule</p>

<div class="controls">
  <div class="ctl-group">
    <span class="ctl-label">Horizon</span>
    <div class="chips" id="horizon">
      <button class="chip" data-h="6">6h</button>
      <button class="chip active" data-h="12">12h</button>
      <button class="chip" data-h="24">24h</button>
      <button class="chip" data-h="48">48h</button>
    </div>
  </div>
  <div class="ctl-group">
    <span class="ctl-label">Mask</span>
    <div class="chips" id="mask">
      <button class="chip" data-m="0">0°</button>
      <button class="chip active" data-m="5">5°</button>
      <button class="chip" data-m="10">10°</button>
      <button class="chip" data-m="20">20°</button>
    </div>
  </div>
</div>

<div class="summary" id="summary">Loading…</div>
<div id="schedule"></div>
<p class="refresh-note">Auto-refreshes every 60 s · <a href="#" id="refresh-now">Refresh now</a></p>

<script type="module" src="/static/js/passes.js"></script>
</body>
</html>
