<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Constellation Globe — GPS Dashboard</title>
  <style>
    :root {
      --bg: #05080f; --surface: #1e293b; --surface2: #263348;
      --border: #334155; --text: #f1f5f9; --muted: #94a3b8; --primary: #3b82f6;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--text); overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px;
    }
    a { color: var(--primary); text-decoration: none; }
    #globe-container { position: fixed; inset: 0; }
    canvas { display: block; }

    .panel {
      position: fixed; top: 14px; left: 14px; width: 270px;
      background: rgba(15, 23, 42, .82); border: 1px solid var(--border);
      border-radius: 10px; padding: 14px 16px; backdrop-filter: blur(6px);
    }
    .nav { display: flex; gap: 14px; margin-bottom: 12px; font-size: 12px; color: var(--muted); }
    .panel h1 { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
    .panel .sub { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .chip {
      background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); padding: 5px 10px; font-size: 12px; cursor: pointer;
    }
    .chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .legend { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 12px; }
    .leg {
      display: inline-flex; align-items: center; gap: 5px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 999px; padding: 2px 9px;
      font-size: 11px; color: var(--text); cursor: pointer;
    }
    .leg.off { opacity: .35; text-decoration: line-through; }
    .sw { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .info { font-size: 12px; color: var(--muted); line-height: 1.7; border-top: 1px solid var(--border); padding-top: 10px; }
    .info b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

    #status {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: 14px; pointer-events: none; text-align: center; padding: 24px;
    }
    #status.hide { display: none; }
    .hint {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      color: var(--muted); font-size: 12px; background: rgba(15, 23, 42, .7);
      padding: 5px 12px; border-radius: 999px;
    }

    .popup {
      position: fixed; width: 232px; z-index: 10; font-size: 12px;
      background: rgba(15, 23, 42, .92); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 14px; backdrop-filter: blur(6px);
    }
    .popup.hidden { display: none; }
    .pop-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .pop-name { display: flex; align-items: center; gap: 7px; font-size: 15px; font-weight: 600; }
    .pop-close { background: none; border: none; color: var(--muted); font-size: 17px; line-height: 1; cursor: pointer; padding: 0 2px; }
    .pop-row { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; color: var(--muted); }
    .pop-row b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  </style>
  <script type="importmap">
  { "imports": { "three": "/static/vendor/three/three.module.js" } }
  </script>
</head>
<body>
  <div id="globe-container"></div>
  <div id="status">Loading constellation…</div>

  <div class="panel">
    <div class="nav"><a href="/">← Dashboard</a><a href="/skyplot">Skyplot</a><a href="/passes">Passes</a></div>
    <h1>Constellation Globe</h1>
    <div class="sub">Satellites we've logged, reconstructed in 3D · drag to orbit · scroll to zoom</div>

    <div class="row" id="windows">
      <button class="chip" data-h="1">1h</button>
      <button class="chip active" data-h="24">24h</button>
      <button class="chip" data-h="168">7d</button>
    </div>
    <div class="row">
      <button class="chip active" id="t-orbits">Orbits</button>
      <button class="chip" id="t-trails">Trails</button>
      <button class="chip active" id="t-rays">Sight lines</button>
      <button class="chip active" id="t-spin">Auto-spin</button>
    </div>

    <div class="legend" id="legend"></div>
    <div class="info" id="info">—</div>
  </div>

  <div class="hint">PC view · drag to orbit · scroll to zoom · click a satellite</div>
  <div id="sat-popup" class="popup hidden"></div>

  <script type="module" src="/static/js/globe.js"></script>
</body>
</html>
