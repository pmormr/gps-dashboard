<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Skyplot — GPS Dashboard</title>
  <style>
    :root {
      --bg: #0f172a; --surface: #1e293b; --surface2: #263348;
      --border: #334155; --text: #f1f5f9; --muted: #94a3b8;
      --primary: #3b82f6; --success: #22c55e; --danger: #ef4444; --warn: #f59e0b;
      --radius: 8px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.5; padding: 16px; max-width: 560px; margin: 0 auto; }
    a { color: var(--primary); text-decoration: none; }
    h1 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
    .nav { display: flex; gap: 16px; margin-bottom: 16px; font-size: 13px; color: var(--muted); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 16px; overflow: hidden; }
    .card-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 10px 14px 0; }

    /* Stats strip */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border); border-top: 1px solid var(--border); margin-top: 10px; }
    .stat { background: var(--surface); padding: 8px 12px; }
    .stat .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .stat .v { font-size: 15px; font-weight: 600; }
    .v.ok { color: var(--success); } .v.warn { color: var(--warn); } .v.err { color: var(--danger); }

    /* Plot */
    #sky-wrap { position: relative; width: 100%; }
    #sky { display: block; width: 100%; touch-action: none; cursor: grab; }
    #sky.dragging { cursor: grabbing; }
    #sky-status { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: var(--muted); font-size: 14px; text-align: center; padding: 16px; }
    #sky-status.show { display: flex; }

    .controls { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--border); flex-wrap: wrap; }
    .btn { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
    .btn:active { background: var(--border); }

    /* Legend */
    .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 12px 14px; border-top: 1px solid var(--border); font-size: 12px; }
    .leg { display: flex; align-items: center; gap: 6px; color: var(--muted); }
    .swatch { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
    .leg-note { width: 100%; color: var(--muted); font-size: 11px; padding-top: 2px; }
    .refresh-note { font-size: 12px; color: var(--muted); text-align: center; margin-top: 8px; }
  </style>
</head>
<body>

<div class="nav">
  <a href="/">← Dashboard</a>
  <a href="/gpsd">gpsd Status</a>
  <a href="/ntp">NTP</a>
  <a href="/sensors">Sensors</a>
</div>

<h1>Satellite Skyplot</h1>
<p style="color:var(--muted);font-size:13px;margin-bottom:16px;">Live 3D sky · drag to rotate · updates every few seconds</p>

<div class="card">
  <div id="sky-wrap">
    <canvas id="sky"></canvas>
    <div id="sky-status" class="show">Connecting to gpsd…</div>
  </div>

  <div class="controls">
    <button class="btn" id="btn-topdown">Top-down</button>
    <button class="btn" id="btn-reset">Reset view</button>
  </div>

  <div class="legend" id="legend"></div>

  <div class="stats">
    <div class="stat"><div class="k">Used / Seen</div><div class="v" id="st-sats">— / —</div></div>
    <div class="stat"><div class="k">Fix</div><div class="v" id="st-fix">—</div></div>
    <div class="stat"><div class="k">HDOP</div><div class="v" id="st-hdop">—</div></div>
    <div class="stat"><div class="k">VDOP</div><div class="v" id="st-vdop">—</div></div>
    <div class="stat"><div class="k">PDOP</div><div class="v" id="st-pdop">—</div></div>
    <div class="stat"><div class="k">Updated</div><div class="v" id="st-age">—</div></div>
  </div>
</div>

<p class="refresh-note">Reading gpsd directly · no history stored</p>

<script src="/static/js/skyplot.js"></script>
</body>
</html>
