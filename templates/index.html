<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GPS Dashboard</title>
  <link rel="stylesheet" href="/static/vendor/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="/static/vendor/nouislider/nouislider.min.css">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="app">

  <div id="view-main" class="view active">
    <div id="map" class="map-container">

      <!-- Right-side stack: FAB + collapsible panels -->
      <div class="right-panel-stack">
        <button id="tl-zoom-here-btn" class="map-fab" title="Zoom to current location">⊕</button>
        <div id="label-panel" class="floating-panel collapsed">
          <button id="label-panel-toggle" class="floating-panel-hdr" type="button">⚙ Labels</button>
          <div class="floating-panel-body">
            <h4>POI categories</h4>
            <div id="label-cats"></div>
            <div class="label-row">
              <h4>Density <span id="label-offv">-1</span></h4>
              <input type="range" id="label-off" min="-4" max="0" step="1" value="-1">
              <div class="label-hint">left = labels appear earlier / denser</div>
            </div>
            <label class="label-check">
              <input type="checkbox" id="label-minor" checked> Minor street names (z13+)
            </label>
          </div>
        </div>
        <div id="marks-panel" class="floating-panel collapsed">
          <button id="marks-panel-toggle" class="floating-panel-hdr" type="button">🚩 Marks</button>
          <div class="floating-panel-body">
            <div class="tl-mark-row">
              <button id="tl-mark-start-btn" class="btn-secondary">Mark Start</button>
              <button id="tl-mark-end-btn" class="btn-secondary">Mark End</button>
              <button id="tl-use-marks-btn" class="btn-secondary hidden">Use Marks</button>
            </div>
            <p id="tl-mark-status" class="muted"></p>
          </div>
        </div>
        <div id="terrain-panel" class="floating-panel collapsed">
          <button id="terrain-panel-toggle" class="floating-panel-hdr" type="button">🏔 3D</button>
          <div class="floating-panel-body">
            <label class="label-check">
              <input type="checkbox" id="terrain-3d-toggle"> 3D terrain
            </label>
            <div id="terrain-exag-row" class="label-row hidden">
              <h4>Exaggeration <span id="terrain-exagv">1.3</span></h4>
              <input type="range" id="terrain-exag" min="0.5" max="3" step="0.1" value="1.3">
              <div class="label-hint">drag to drive a mountain harder</div>
            </div>
          </div>
        </div>
        <div id="drone-panel" class="floating-panel collapsed">
          <button id="drone-panel-toggle" class="floating-panel-hdr" type="button">🚁 Drone</button>
          <div class="floating-panel-body">
            <label class="label-check">
              <input type="checkbox" id="drone-toggle"> Show drone flights
            </label>
            <!-- Swatch colors mirror DRONE_COLORS in static/js/map.js -->
            <div class="drone-legend">
              <span class="drone-legend-item"><span class="drone-swatch" style="background:#a855f7"></span>Mini 5 Pro</span>
              <span class="drone-legend-item"><span class="drone-swatch" style="background:#f97316"></span>Avata 2</span>
              <span class="drone-legend-item"><span class="drone-swatch" style="background:#ec4899"></span>Neo</span>
            </div>
            <p id="drone-status" class="muted"></p>
          </div>
        </div>
      </div>

      <!-- Bottom: time picker + slider strip + actions -->
      <div class="map-overlay map-overlay-bottom">
        <div class="tl-time-row">
          <button id="timepicker-trigger" class="timepicker-trigger" type="button">
            <span class="timepicker-trigger-icon">⏱</span>
            <span id="timepicker-trigger-label">Live · Last 24h</span>
            <span class="timepicker-trigger-caret">▾</span>
          </button>
          <span id="tl-status"></span>
        </div>
        <div id="tl-slider-wrap" class="tl-slider-wrap hidden">
          <canvas id="tl-density" class="tl-density"></canvas>
          <div id="tl-slider"></div>
          <div id="tl-stop-overlay" class="tl-slider-overlay"></div>
          <div id="tl-slider-overlay" class="tl-slider-overlay"></div>
          <div class="tl-slider-labels">
            <span id="tl-start-label"></span>
            <span id="tl-selection-count" class="muted"></span>
            <span id="tl-end-label"></span>
          </div>
        </div>
        <p id="tl-empty" class="hidden muted"></p>
        <div class="tl-bottom-actions">
          <button id="tl-zoom-range-btn" class="btn-secondary" disabled>Zoom to Range</button>
          <button id="tl-bookmark-btn" class="btn-secondary hidden">📍 Bookmark Here</button>
          <button id="tl-create-btn" class="btn-primary" disabled>Create Range</button>
        </div>
      </div>

    </div>
  </div>

  <!-- ── Tile refresh banner ── -->
  <div id="tile-refresh-banner" class="tile-refresh-banner hidden">
    Refreshing tiles in background — reload page to see updates
  </div>

  <!-- ── Tab bar (status links + drawer toggle) ── -->
  <nav id="tab-bar">
    <button id="annotations-drawer-toggle" class="tab-drawer-toggle" type="button">
      <span>📍 Annotations</span>
      <span id="annotations-drawer-count" class="annotations-drawer-count hidden">0</span>
    </button>
    <div class="tab-status-links">
      <a href="/gpsd" target="_blank">GPS</a>
      <a href="/ntp" target="_blank">NTP</a>
      <a href="/sensors" target="_blank">Sensors</a>
      <select id="layer-select" title="Map layer">
        <option value="osm">OSM</option>
        <option value="usgs">USGS Topo</option>
      </select>
      <label class="tab-refresh-label" title="Check upstream for updated tiles">
        <input type="checkbox" id="tile-refresh-toggle"> ↻
      </label>
    </div>
  </nav>

</div>

<!-- Annotations side drawer (desktop) / bottom sheet (mobile) -->
<aside id="annotations-drawer" class="ann-drawer hidden">
  <div class="ann-drawer-header">
    <h2>Annotations</h2>
    <button id="annotations-drawer-close" class="btn-icon" title="Close drawer">×</button>
  </div>
  <div id="annotations-list"></div>
</aside>

<!-- Time picker popover (desktop) / bottom sheet (mobile) -->
<div id="timepicker-pop" class="timepicker-pop hidden">
  <div class="timepicker-card">
    <div class="timepicker-modes">
      <button type="button" data-mode="last" class="active">Last</button>
      <button type="button" data-mode="around">Around</button>
      <button type="button" data-mode="range">From → To</button>
    </div>

    <div class="timepicker-presets">
      <button type="button" data-preset="900000">15m</button>
      <button type="button" data-preset="3600000">1h</button>
      <button type="button" data-preset="21600000">6h</button>
      <button type="button" data-preset="86400000">24h</button>
      <button type="button" data-preset="604800000">7d</button>
      <button type="button" data-preset="2592000000">30d</button>
    </div>

    <div id="timepicker-relative" class="timepicker-fields">
      <label>
        <span>Anchor</span>
        <div class="timepicker-anchor-row">
          <input type="datetime-local" id="timepicker-anchor">
          <button type="button" id="timepicker-anchor-now" class="btn-secondary">Now</button>
        </div>
      </label>
      <label>
        <span>Window</span>
        <div class="timepicker-window-row">
          <input type="number" id="timepicker-window-num" min="1" step="1">
          <select id="timepicker-window-unit">
            <option value="60000">minutes</option>
            <option value="3600000">hours</option>
            <option value="86400000">days</option>
            <option value="604800000">weeks</option>
          </select>
        </div>
      </label>
      <label class="timepicker-live-row">
        <input type="checkbox" id="timepicker-live">
        <span>Live — anchor follows now, auto-refresh</span>
      </label>
    </div>

    <div id="timepicker-absolute" class="timepicker-fields hidden">
      <label>
        <span>From</span>
        <input type="datetime-local" id="timepicker-from">
      </label>
      <label>
        <span>To</span>
        <input type="datetime-local" id="timepicker-to">
      </label>
    </div>

    <div class="timepicker-actions">
      <button type="button" id="timepicker-cancel" class="btn-secondary">Cancel</button>
      <button type="button" id="timepicker-apply" class="btn-primary">Apply</button>
    </div>
  </div>
</div>

<!-- Annotation creation overlay -->
<div id="annotation-form-overlay" class="overlay hidden">
  <div class="overlay-card">
    <h3 id="annotation-form-title">New Annotation</h3>
    <label>
      Name
      <input type="text" id="annotation-name-input" placeholder="e.g. Denver to Moab" autocomplete="off">
    </label>
    <label>
      Notes
      <textarea id="annotation-notes-input" placeholder="Optional notes"></textarea>
    </label>
    <p id="annotation-form-when" class="muted"></p>
    <div class="overlay-actions">
      <button id="annotation-form-cancel" class="btn-secondary">Cancel</button>
      <button id="annotation-form-save" class="btn-primary">Save</button>
    </div>
  </div>
</div>

<script src="/static/vendor/maplibre/maplibre-gl.js"></script>
<script src="/static/vendor/pmtiles/pmtiles.js"></script>
<script src="/static/vendor/nouislider/nouislider.min.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/geo.js"></script>
<script src="/static/js/map.js"></script>
<script src="/static/js/labels.js"></script>
<script src="/static/js/timepicker.js"></script>
<script src="/static/js/timeline.js"></script>
<script src="/static/js/annotations.js"></script>
<script src="/static/js/drone.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
