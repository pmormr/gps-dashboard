[project]
name = "gps-dashboard"
version = "0.1.0"
description = "GPS history browser for a Raspberry Pi van build"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "requests>=2.32",
    "httpx>=0.27",
    "click>=8.0",
    "paho-mqtt>=2.1.0",
    "obd>=0.7.3",
    "pillow>=12.3.0",
    "pmtiles>=3.7",
    "waitress>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Flat layout: the importable packages live at the repo root rather than under a
# src/ dir, so enumerate them explicitly (hatchling can't infer a single package
# from the distribution name). `uv sync` installs the project editable, which puts
# every package on sys.path — so scripts run as `uv run tools/foo.py` can import
# `common`, `api`, `processor`, … with no sys.path bootstrap.
[tool.hatch.build.targets.wheel]
packages = ["api", "broadcast", "common", "logger", "mqttbus", "processor", "radio", "sensors", "tools", "updater"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.18",
    "mypy>=1.15",
    "types-requests>=2.32",
    "sgp4>=2.25",
    "osmium>=4.3.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Lean baseline: pycodestyle (E/W), pyflakes (F), isort (I), pyupgrade (UP),
# flake8-bugbear (B). Catches real bugs and modernizes idioms with low noise;
# grow the set as needed.
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["api", "broadcast", "common", "logger", "mqttbus", "processor", "radio", "sensors", "tools", "updater"]

[tool.ruff.format]
# Codebase is overwhelmingly single-quoted; keep it that way.
quote-style = "single"

[tool.mypy]
# Lenient global baseline: type-check annotated code and surface real errors,
# but don't force annotations — untyped function bodies stay unchecked until a
# module opts into the strict profile below. Strict surface ratchets outward.
python_version = "3.11"
files = ["api", "broadcast", "common", "logger", "mqttbus", "processor", "radio", "sensors", "tools", "updater", "tests"]
warn_redundant_casts = true
warn_unused_configs = true
pretty = true

# Untyped third-party libraries (no stubs shipped).
[[tool.mypy.overrides]]
module = ["obd", "paho.mqtt.*", "sgp4.*", "pmtiles.*", "waitress.*"]
ignore_missing_imports = true

# Strict profile for the load-bearing, already-well-typed core. Ratchet items
# left for later: disallow_untyped_calls, disallow_untyped_decorators, and
# widening this module list to api.routes.*/tools.*/sensors.*/mqttbus.*.
[[tool.mypy.overrides]]
module = ["processor.*", "common.*", "logger.*", "radio.*", "updater.*", "broadcast.*", "weather.*", "api.db", "api.params"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
strict_equality = true
no_implicit_reexport = true
