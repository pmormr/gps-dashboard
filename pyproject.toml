[project]
name = "gps-dashboard"
version = "0.1.0"
description = "GPS history browser for a Raspberry Pi van build"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "requests>=2.32",
    "httpx>=0.27",
    "click>=8.0",
    "paho-mqtt>=2.1.0",
    "bme680>=2.0.0",
    "obd>=0.7.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Flat layout: the importable packages live at the repo root rather than under a
# src/ dir, so enumerate them explicitly (hatchling can't infer a single package
# from the distribution name). `uv sync` installs the project editable, which puts
# every package on sys.path — so scripts run as `uv run tools/foo.py` can import
# `common`, `api`, `processor`, … with no sys.path bootstrap.
[tool.hatch.build.targets.wheel]
packages = ["api", "common", "logger", "mqttbus", "processor", "sensors", "tools"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Lean baseline: pycodestyle (E/W), pyflakes (F), isort (I), pyupgrade (UP),
# flake8-bugbear (B). Catches real bugs and modernizes idioms with low noise;
# grow the set as needed.
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["api", "common", "logger", "mqttbus", "processor", "sensors", "tools"]

[tool.ruff.format]
# Codebase is overwhelmingly single-quoted; keep it that way.
quote-style = "single"
