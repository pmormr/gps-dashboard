# Shared capture for the Digirig codec (R10 in .claude/modules/radio.md).
#
# The hw device is single-open; dsnoop lets radio-recorder (arecord) and
# radio-stream (ffmpeg) capture simultaneously and independently — either one
# runs fine with the other stopped. The slave pins the codec's native format
# (the recorder's block math assumes S16_LE 48 kHz mono) with 100 ms periods
# matching the recorder's block cadence and a 2 s ring — the recorder's
# --buffer-time=2000000 overrun margin is capped by this ring, so keep it 2 s.
#
# Manual install (the deploy hook copies only *.service/*.timer):
#   sudo cp deploy/asound.conf /etc/asound.conf
# then restart radio-recorder and radio-stream.

pcm.digirig_dsnoop {
    type dsnoop
    ipc_key 87231
    slave {
        pcm "hw:CARD=Digirig"
        format S16_LE
        rate 48000
        channels 1
        period_size 4800
        buffer_size 96000
    }
}

# Consumers open this one; plug converts if a consumer asks for another format.
pcm.digirig_shared {
    type plug
    slave.pcm "digirig_dsnoop"
}
