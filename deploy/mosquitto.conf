# mosquitto broker for the sensor platform.
#
# Trusted van LAN, no auth (matches the app's "no authentication, LAN is trusted"
# stance — Decision D leans anonymous). Two listeners: tcp for Pi-side publishers
# and subscribers, websockets for the browser (MQTT-over-WS, Decision #3).
#
# Install on the Pi:
#   sudo cp deploy/mosquitto.conf /etc/mosquitto/conf.d/gps-sensors.conf
#   sudo systemctl restart mosquitto

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous true

# Persistence lets QoS-1 messages survive a broker restart and be redelivered to
# subscribers that reconnect with a persistent session (clean_session=false).
persistence true
persistence_location /mnt/nvme/data/mosquitto/
autosave_interval 60
