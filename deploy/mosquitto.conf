# mosquitto broker for the sensor platform.
#
# Trusted van LAN, no auth (Decision D: anonymous, matches the app's no-auth
# stance). An explicit listener is required so the broker binds all interfaces
# (0.0.0.0) rather than mosquitto 2.0's localhost-only default — ESP32 nodes and
# the phone browser are on the LAN.
#
# WEBSOCKETS (Phase 3): browser MQTT-over-WS (Decision #3) needs a `:9001`
# `protocol websockets` listener, but Debian bookworm's mosquitto is built WITHOUT
# libwebsockets — adding that listener makes the broker refuse to start. Enabling WS
# is a Phase 3 prerequisite: rebuild mosquitto with libwebsockets, find a backport,
# or bridge MQTT→browser through Flask. Tracked in docs/sensor-platform-plan.md.
#
# PERSISTENCE (QoS-1 queuing across a broker restart) is inherited from the package
# default (/etc/mosquitto/mosquitto.conf → /var/lib/mosquitto). Do NOT redeclare
# persistence or persistence_location here: mosquitto 2.0 hard-errors on a duplicate.
#
# Install on the Pi:
#   sudo cp deploy/mosquitto.conf /etc/mosquitto/conf.d/gps-sensors.conf
#   sudo systemctl restart mosquitto

listener 1883
protocol mqtt

allow_anonymous true
