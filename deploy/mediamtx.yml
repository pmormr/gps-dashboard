# MediaMTX — the van's media hub (R10 in .claude/modules/radio.md).
# Radio audio + hill-climb camera feeds (plans/streaming-platform-plan.md) +
# the van's own Dahua IP cams, pulled on-demand (plans/cameras-plan.md).
#
# Read from the deploy checkout by mediamtx.service, so config edits deploy on
# push (the Pi-side hook restarts mediamtx when this file changes). The binary
# is a manual install: /mnt/nvme/mediamtx/mediamtx — a static arm64 build,
# v1.19.2; keys below match that version's schema, and unset keys take that
# version's defaults.
#
# The LAN is trusted (no auth), matching the rest of the app. RTSP + WebRTC
# serve consumers: VLC/OBS consume RTSP (:8554); the built-in WebRTC page
# (http://<pi>:8889/radio) is the sub-second browser/phone listen path — no
# STUN needed on the offline LAN (host candidates via webrtcIPsFromInterfaces).
# SRT (:8890) is enabled for camera ingest — the hill-climb Pi encoders publish
# over SRT for its retransmit + latency buffer on the lossy long-distance link.

logLevel: info

api: false
metrics: false
pprof: false
playback: false
rtmp: false
hls: false
srt: true
moq: false

rtsp: true
rtspAddress: :8554
rtspTransports: [udp, multicast, tcp]

webrtc: true
webrtcAddress: :8889

srtAddress: :8890

paths:
  # Live radio audio (Digirig SP1 A+B mix), published by radio-stream.service.
  radio:
    source: publisher

  # Hill-climb live stream: each course-position Pi runs ffmpeg and SRT-publishes
  # here with streamid `publish:camN`. See plans/streaming-platform-plan.md and
  # paul-network-docs events/2026-hillclimb.md.
  cam1:
    source: publisher
  cam2:
    source: publisher
  cam3:
    source: publisher
  cam4:
    source: publisher

  # The van's four Dahua IP cams (plans/cameras-plan.md), pulled direct from each
  # camera (C2 — not via the NVR, so recording load is untouched). Two paths per
  # cam: the sub stream (H.264 D1@15, the glance feed) and the third stream
  # (`-hd`, H.264 720p@30, the expand + driving feed). The main stream stays
  # H.265 for NVR recording and is never proxied (WebRTC can't decode H.265).
  #
  # sourceOnDemand (C4): idle cost is zero — nothing is pulled until a viewer
  # attaches, at ~1-2 s connect latency. The 10s close/start-timeout defaults
  # apply. rtspTransport: tcp — no UDP loss on the pull leg.
  #
  # This file is a TEMPLATE: MediaMTX v1.19.2 does not interpolate ${VAR} in
  # config values, so mediamtx-run.sh substitutes ${GPS_DAHUA_PASSWORD_URLENC}
  # at service start and runs the hub on the rendered copy (C5). That var is the
  # URL-percent-encoded twin of GPS_DAHUA_PASSWORD (the raw form the dahua_reader
  # uses for digest auth) — the password has a char illegal in a URL's userinfo,
  # which Go's url.Parse rejects raw ("is not a valid URL"). Both vars live in
  # the root-600 /etc/default/gps-dahua — keep them in sync on a password change.
  # RTSP form: rtsp://admin:<pw>@<host>:554/cam/realmonitor?channel=1&subtype=N
  # (subtype=1 sub, subtype=2 third). Do NOT reuse the cam1-cam4 names above —
  # those are the hill-climb SRT publisher paths, a different mechanism.
  cam-front:
    source: rtsp://admin:${GPS_DAHUA_PASSWORD_URLENC}@192.168.42.51:554/cam/realmonitor?channel=1&subtype=1
    sourceOnDemand: yes
    rtspTransport: tcp
  cam-front-hd:
    source: rtsp://admin:${GPS_DAHUA_PASSWORD_URLENC}@192.168.42.51:554/cam/realmonitor?channel=1&subtype=2
    sourceOnDemand: yes
    rtspTransport: tcp
  cam-blind-left:
    source: rtsp://admin:${GPS_DAHUA_PASSWORD_URLENC}@192.168.42.52:554/cam/realmonitor?channel=1&subtype=1
    sourceOnDemand: yes
    rtspTransport: tcp
  cam-blind-left-hd:
    source: rtsp://admin:${GPS_DAHUA_PASSWORD_URLENC}@192.168.42.52:554/cam/realmonitor?channel=1&subtype=2
    sourceOnDemand: yes
    rtspTransport: tcp
  cam-blind-right:
    source: rtsp://admin:${GPS_DAHUA_PASSWORD_URLENC}@192.168.42.53:554/cam/realmonitor?channel=1&subtype=1
    sourceOnDemand: yes
    rtspTransport: tcp
  cam-blind-right-hd:
    source: rtsp://admin:${GPS_DAHUA_PASSWORD_URLENC}@192.168.42.53:554/cam/realmonitor?channel=1&subtype=2
    sourceOnDemand: yes
    rtspTransport: tcp
  cam-rear:
    source: rtsp://admin:${GPS_DAHUA_PASSWORD_URLENC}@192.168.42.54:554/cam/realmonitor?channel=1&subtype=1
    sourceOnDemand: yes
    rtspTransport: tcp
  cam-rear-hd:
    source: rtsp://admin:${GPS_DAHUA_PASSWORD_URLENC}@192.168.42.54:554/cam/realmonitor?channel=1&subtype=2
    sourceOnDemand: yes
    rtspTransport: tcp
