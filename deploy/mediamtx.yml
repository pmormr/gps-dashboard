# MediaMTX — the van's media hub (R10 in .claude/modules/radio.md).
# Radio audio + hill-climb camera feeds (plans/streaming-platform-plan.md) +
# the van's own Dahua IP cams, pulled on-demand (plans/cameras-plan.md).
#
# Read from the deploy checkout by mediamtx.service, so config edits deploy on
# push (the Pi-side hook restarts mediamtx when this file changes). The binary
# is a manual install: /mnt/nvme/mediamtx/mediamtx — a static arm64 build,
# v1.19.2; keys below match that version's schema, and unset keys take that
# version's defaults.
#
# The LAN is trusted (no auth), matching the rest of the app. RTSP + WebRTC
# serve consumers: VLC/OBS consume RTSP (:8554); the built-in WebRTC page
# (http://<pi>:8889/radio) is the sub-second browser/phone listen path — no
# STUN needed on the offline LAN (host candidates via webrtcIPsFromInterfaces).
# SRT (:8890) is enabled for camera ingest — the hill-climb Pi encoders publish
# over SRT for its retransmit + latency buffer on the lossy long-distance link.
# RTMP (:1935) is enabled for the DJI drone's built-in "Custom RTMP" live stream:
# the DJI app publishes to rtmp://<pi>:1935/drone1 (or /drone2) (H.264/AAC),
# consumed like any other path (WebRTC http://<pi>:8889/drone1, or RTSP
# rtsp://<pi>:8554/drone1 in OBS/VLC). The phone running the DJI app must be on the
# van LAN to reach the hub. No auth — trusted LAN, matching the rest of the hub.
# (The public cloud hub on vps202051 runs the same two paths but WITH auth — see
# paul-network-docs cloud/devices/vps202051.md.)

logLevel: info

# Control API — localhost only (127.0.0.1), read by the dashboard's /api/mediamtx
# status page for per-path stream state (ready/tracks/readers). Not exposed to the
# LAN; the read-only listing is all the status page needs.
api: yes
apiAddress: 127.0.0.1:9997
metrics: false
pprof: false
playback: false
rtmp: true
hls: false
srt: true
moq: false

rtsp: true
rtspAddress: :8554
rtspTransports: [udp, multicast, tcp]

webrtc: true
webrtcAddress: :8889

srtAddress: :8890

rtmpAddress: :1935

paths:
  # >>> BEGIN generated van paths — tools/gen_mediamtx_paths.py (do not edit) <<<
  # Van publisher paths, generated from broadcast/feeds.py (B8). The Dahua
  # on-demand proxy block below is hand-maintained (cameras-owned).

  # cam1 — PtP cam 1 (SRT publish :8890)
  cam1:
    source: publisher

  # cam2 — PtP cam 2 (SRT publish :8890)
  cam2:
    source: publisher

  # cam3 — PtP cam 3 (SRT publish :8890)
  cam3:
    source: publisher

  # cam4 — PtP cam 4 (SRT publish :8890)
  cam4:
    source: publisher

  # radio — Radio audio (in-hub publisher)
  radio:
    source: publisher

  # drone1 — Drone 1 · van WiFi (spare) (RTMP publish :1935)
  drone1:
    source: publisher

  # drone2 — Drone 2 · van WiFi (event) (RTMP publish :1935)
  drone2:
    source: publisher
  # >>> END generated van paths <<<

  # The van's four Dahua IP cams (plans/cameras-plan.md), pulled direct from each
  # camera (C2 — not via the NVR, so recording load is untouched). Two paths per
  # cam: the sub stream (H.264 D1@15, the glance feed) and the third stream
  # (`-hd`, H.264 720p@30, the expand + driving feed). The main stream stays
  # H.265 for NVR recording and is never proxied (WebRTC can't decode H.265).
  #
  # sourceOnDemand (C4): idle cost is zero — nothing is pulled until a viewer
  # attaches, at ~1-2 s connect latency. The 10s close/start-timeout defaults
  # apply. rtspTransport: tcp — no UDP loss on the pull leg.
  #
  # This file is a TEMPLATE: MediaMTX v1.19.2 does not interpolate ${VAR} in
  # config values (a ${...} left in a source URL reaches Go's url.Parse literally
  # and crash-loops the hub — the `{` `}` are the illegal chars, not anything in
  # the password). So mediamtx-run.sh substitutes the URL-encoded-password
  # placeholder below at service start and runs the hub on the rendered copy
  # (C5). Do NOT name that placeholder token in this prose — the wrapper's plain
  # string replace would swap it here too, leaking the password into the rendered
  # comment. The value is GPS_DAHUA_PASSWORD (root-600 /etc/default/gps-dahua,
  # the raw form the dahua_reader uses for digest auth) URL-percent-encoded by
  # the wrapper — defensive, so a rotation to a genuinely URL-unsafe char stays
  # valid in the userinfo.
  # RTSP form: rtsp://admin:<pw>@<host>:554/cam/realmonitor?channel=1&subtype=N
  # (subtype=1 sub, subtype=2 third). Do NOT reuse the cam1-cam4 names above —
  # those are the hill-climb SRT publisher paths, a different mechanism.
  cam-front:
    source: rtsp://admin:${GPS_DAHUA_PASSWORD_URLENC}@192.168.42.51:554/cam/realmonitor?channel=1&subtype=1
    sourceOnDemand: yes
    rtspTransport: tcp
  cam-front-hd:
    source: rtsp://admin:${GPS_DAHUA_PASSWORD_URLENC}@192.168.42.51:554/cam/realmonitor?channel=1&subtype=2
    sourceOnDemand: yes
    rtspTransport: tcp
  cam-blind-left:
    source: rtsp://admin:${GPS_DAHUA_PASSWORD_URLENC}@192.168.42.52:554/cam/realmonitor?channel=1&subtype=1
    sourceOnDemand: yes
    rtspTransport: tcp
  cam-blind-left-hd:
    source: rtsp://admin:${GPS_DAHUA_PASSWORD_URLENC}@192.168.42.52:554/cam/realmonitor?channel=1&subtype=2
    sourceOnDemand: yes
    rtspTransport: tcp
  cam-blind-right:
    source: rtsp://admin:${GPS_DAHUA_PASSWORD_URLENC}@192.168.42.53:554/cam/realmonitor?channel=1&subtype=1
    sourceOnDemand: yes
    rtspTransport: tcp
  cam-blind-right-hd:
    source: rtsp://admin:${GPS_DAHUA_PASSWORD_URLENC}@192.168.42.53:554/cam/realmonitor?channel=1&subtype=2
    sourceOnDemand: yes
    rtspTransport: tcp
  cam-rear:
    source: rtsp://admin:${GPS_DAHUA_PASSWORD_URLENC}@192.168.42.54:554/cam/realmonitor?channel=1&subtype=1
    sourceOnDemand: yes
    rtspTransport: tcp
  cam-rear-hd:
    source: rtsp://admin:${GPS_DAHUA_PASSWORD_URLENC}@192.168.42.54:554/cam/realmonitor?channel=1&subtype=2
    sourceOnDemand: yes
    rtspTransport: tcp

  # Full-res main streams (subtype=0): H.265 2688×1520 + the camera's main-stream
  # audio (front PCM / rear G.711). These are **RTSP-only** — consume in OBS/VLC at
  # rtsp://<pi>:8554/cam-<pos>-main. They do NOT work in the browser WebRTC page
  # (WHEP can't decode H.265); that's the only reason the grid uses the H.264
  # sub/third feeds. On-demand, so the camera only serves this second main
  # connection while someone's actually viewing — the NVR's own recording pull is
  # untouched (we pull direct from the camera, not via the NVR; C2).
  cam-front-main:
    source: rtsp://admin:${GPS_DAHUA_PASSWORD_URLENC}@192.168.42.51:554/cam/realmonitor?channel=1&subtype=0
    sourceOnDemand: yes
    rtspTransport: tcp
  cam-blind-left-main:
    source: rtsp://admin:${GPS_DAHUA_PASSWORD_URLENC}@192.168.42.52:554/cam/realmonitor?channel=1&subtype=0
    sourceOnDemand: yes
    rtspTransport: tcp
  cam-blind-right-main:
    source: rtsp://admin:${GPS_DAHUA_PASSWORD_URLENC}@192.168.42.53:554/cam/realmonitor?channel=1&subtype=0
    sourceOnDemand: yes
    rtspTransport: tcp
  cam-rear-main:
    source: rtsp://admin:${GPS_DAHUA_PASSWORD_URLENC}@192.168.42.54:554/cam/realmonitor?channel=1&subtype=0
    sourceOnDemand: yes
    rtspTransport: tcp
